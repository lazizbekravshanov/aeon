name: Deploy league tables to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - league-tables/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Point the repo's Pages site at gh-pages if it isn't configured yet.
      # Best effort: the runner token cannot always do this, in which case it
      # stays a one-time click in Settings > Pages.
      - name: Ensure Pages serves gh-pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api")
          echo "GET /pages -> $status"
          if [ "$status" = "404" ]; then
            code=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}')
            echo "POST /pages -> $code"; cat /tmp/create.json
          else
            echo "Pages already configured:"; cat /tmp/pages.json
          fi

      # Publishes league-tables/ to the gh-pages branch; GitHub serves it
      # at https://lazizbekravshanov.github.io/aeon/. Branch publishing is
      # used because the runner token may not create a Pages site via the
      # API (configure-pages enablement returned 403 on this repo).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./league-tables
